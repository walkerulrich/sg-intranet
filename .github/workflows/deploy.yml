name: CI/CD SG-Intranet

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : QUALITÉ DU CODE
  # ─────────────────────────────────────────
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install flake8 black
          pip install -r requirements.txt

      - name: Run Black
        run: |
          cd backend
          black . --exclude="app/api/auth.py|app/services/seed.py"

      - name: Run Flake8
        run: |
          cd backend
          flake8 . --max-line-length=120 --exclude=__pycache__,app/services/seed.py --extend-ignore=F401,E501

  # ─────────────────────────────────────────
  # JOB 2 : TESTS
  # ─────────────────────────────────────────
  test:
    name: Tests Backend
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ vars.DB_USER }}
          POSTGRES_PASSWORD: ${{ vars.DB_PASSWORD }}
          POSTGRES_DB: ${{ vars.DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          cd backend
          pytest -v
        env:
          DATABASE_URL: postgresql+asyncpg://${{ vars.DB_USER }}:${{ vars.DB_PASSWORD }}@localhost:5432/${{ vars.DB_NAME }}
          JWT_SECRET: test-secret-key

  # ─────────────────────────────────────────
  # JOB 3 : BUILD & PUSH SUR ECR
  # ─────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend
        run: |
          docker build -t $ECR_REGISTRY/societe_generale:backend-${{ github.sha }} ./backend
          docker push $ECR_REGISTRY/societe_generale:backend-${{ github.sha }}
          docker tag $ECR_REGISTRY/societe_generale:backend-${{ github.sha }} $ECR_REGISTRY/societe_generale:backend-latest
          docker push $ECR_REGISTRY/societe_generale:backend-latest

      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=http://k8s-sgintran-sgintran-55c5fc87db-1671610882.eu-north-1.elb.amazonaws.com \
            -t $ECR_REGISTRY/societe_generale:frontend-${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/societe_generale:frontend-${{ github.sha }}
          docker tag $ECR_REGISTRY/societe_generale:frontend-${{ github.sha }} $ECR_REGISTRY/societe_generale:frontend-latest
          docker push $ECR_REGISTRY/societe_generale:frontend-latest

  # ─────────────────────────────────────────
  # JOB 4 : DÉPLOIEMENT SUR EKS
  # ─────────────────────────────────────────
  deploy:
    name: Deploy sur EKS Fargate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION }}

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment/backend -n sg-intranet
          kubectl rollout restart deployment/frontend -n sg-intranet

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n sg-intranet --timeout=180s
          kubectl rollout status deployment/frontend -n sg-intranet --timeout=180s
          kubectl rollout status deployment/postgres -n sg-intranet --timeout=180s || true

      - name: Get ALB URL
        run: |
          echo "⏳ Attente création ALB..."
          sleep 30
          kubectl get ingress sg-intranet-ingress -n sg-intranet

  # ─────────────────────────────────────────
  # JOB 5 : NOTIFICATION
  # ─────────────────────────────────────────
  notify:
    name: Notification résultat
    runs-on: ubuntu-latest
    needs: [lint, test, build, deploy]
    if: always()
    steps:
      - name: Résumé du pipeline
        run: |
          echo "================================"
          echo "  RÉSUMÉ CI/CD SG-INTRANET"
          echo "================================"
          echo "Lint     : ${{ needs.lint.result }}"
          echo "Tests    : ${{ needs.test.result }}"
          echo "Build    : ${{ needs.build.result }}"
          echo "Deploy   : ${{ needs.deploy.result }}"
          echo "Branche  : ${{ github.ref_name }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Lien     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"