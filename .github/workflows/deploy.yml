name: CI/CD SG-Intranet

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : QUALITÉ DU CODE
  # ─────────────────────────────────────────
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install flake8 black
          pip install -r requirements.txt

      - name: Run Black
        run: |
          cd backend
          black . --exclude="app/api/auth.py|app/services/seed.py"

      - name: Run Flake8
        run: |
          cd backend
          flake8 . --max-line-length=120 --exclude=__pycache__

  # ─────────────────────────────────────────
  # JOB 2 : TESTS
  # ─────────────────────────────────────────
  test:
    name: Tests Backend
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ vars.DB_USER }}
          POSTGRES_PASSWORD: ${{ vars.DB_PASSWORD }}
          POSTGRES_DB: ${{ vars.DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          cd backend
          pytest -v
        env:
          DATABASE_URL: postgresql+asyncpg://${{ vars.DB_USER }}:${{ vars.DB_PASSWORD }}@localhost:5432/${{ vars.DB_NAME }}
          JWT_SECRET: test-secret-key

  # ─────────────────────────────────────────
  # JOB 3 : BUILD & PUSH SUR ECR
  # ─────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend
        run: |
          docker build -t $ECR_REGISTRY/societe_generale:backend-${{ github.sha }} ./backend
          docker push $ECR_REGISTRY/societe_generale:backend-${{ github.sha }}
          docker tag $ECR_REGISTRY/societe_generale:backend-${{ github.sha }} $ECR_REGISTRY/societe_generale:backend-latest
          docker push $ECR_REGISTRY/societe_generale:backend-latest

      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.EC2_HOST }}:8000 \
            -t $ECR_REGISTRY/societe_generale:frontend-${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/societe_generale:frontend-${{ github.sha }}
          docker tag $ECR_REGISTRY/societe_generale:frontend-${{ github.sha }} $ECR_REGISTRY/societe_generale:frontend-latest
          docker push $ECR_REGISTRY/societe_generale:frontend-latest

  # ─────────────────────────────────────────
  # JOB 4 : DÉPLOIEMENT SUR EC2
  # ─────────────────────────────────────────
  deploy:
    name: Deploy sur EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login ECR
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Créer le dossier app
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app

            # Générer le .env
            cat > .env <<EOF
            DATABASE_URL=postgresql+asyncpg://${{ vars.DB_USER }}:${{ vars.DB_PASSWORD }}@${{ vars.DB_HOST }}:5432/${{ vars.DB_NAME }}
            JWT_SECRET=sg-intranet-secret-2026
            DB_HOST=${{ vars.DB_HOST }}
            DB_PORT=5432
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ vars.DB_PASSWORD }}
            EOF

            # Générer le docker-compose.yml
            cat > docker-compose.yml <<EOF
            services:
              postgres:
                image: postgres:16-alpine
                environment:
                  POSTGRES_USER: ${{ vars.DB_USER }}
                  POSTGRES_PASSWORD: ${{ vars.DB_PASSWORD }}
                  POSTGRES_DB: ${{ vars.DB_NAME }}
                ports:
                  - "5432:5432"
                volumes:
                  - sg_postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${{ vars.DB_USER }} -d ${{ vars.DB_NAME }}"]
                  interval: 5s
                  timeout: 5s
                  retries: 10

              backend:
                image: ${{ secrets.ECR_REGISTRY }}/societe_generale:backend-latest
                ports:
                  - "8000:8000"
                env_file:
                  - .env
                depends_on:
                  postgres:
                    condition: service_healthy

              frontend:
                image: ${{ secrets.ECR_REGISTRY }}/societe_generale:frontend-latest
                ports:
                  - "5173:5173"
                depends_on:
                  - backend

            volumes:
              sg_postgres_data:
            EOF

            # Pull les nouvelles images
            docker pull ${{ secrets.ECR_REGISTRY }}/societe_generale:backend-latest
            docker pull ${{ secrets.ECR_REGISTRY }}/societe_generale:frontend-latest

            # Redémarrer les services
            docker compose down
            docker compose up -d

            # Nettoyage
            docker image prune -f

            echo "✅ Déploiement terminé !"

  # ─────────────────────────────────────────
  # JOB 5 : NOTIFICATION
  # ─────────────────────────────────────────
  notify:
    name: Notification résultat
    runs-on: ubuntu-latest
    needs: [lint, test, build, deploy]
    if: always()
    steps:
      - name: Résumé du pipeline
        run: |
          echo "================================"
          echo "  RÉSUMÉ CI/CD SG-INTRANET"
          echo "================================"
          echo "Lint     : ${{ needs.lint.result }}"
          echo "Tests    : ${{ needs.test.result }}"
          echo "Build    : ${{ needs.build.result }}"
          echo "Deploy   : ${{ needs.deploy.result }}"
          echo "Branche  : ${{ github.ref_name }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Lien     : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"