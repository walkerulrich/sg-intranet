services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: sg
      POSTGRES_DB: sg_intranet
    ports:
      - "5432:5432"
    volumes:
      - sg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg -d sg_intranet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sg:sg@postgres:5432/sg_intranet
      JWT_SECRET: lab-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  sg_postgres_data:
