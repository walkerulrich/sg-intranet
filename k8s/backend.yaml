apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sg-intranet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 881005428220.dkr.ecr.eu-north-1.amazonaws.com/societe_generale:backend-latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://sg:sg@postgres:5432/sg_intranet"
            - name: JWT_SECRET
              value: "sg-intranet-secret-2026"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sg-intranet
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000